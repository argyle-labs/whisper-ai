    <path d="M210 374 H302" stroke="#10A37F" stroke-width="18"/>
  </g>
  <rect x="212" y="136" width="88" height="160" rx="44" fill="#10A37F" stroke="#02160F" stroke-width="7"/>
  <g stroke="#02160F" stroke-width="6" stroke-linecap="round">
    <line x1="228" y1="182" x2="284" y2="182"/>
    <line x1="228" y1="212" x2="284" y2="212"/>
    <line x1="228" y1="242" x2="284" y2="242"/>
  </g>
</svg>
